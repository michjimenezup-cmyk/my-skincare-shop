<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Bag | Curology Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CUROLOGY</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-container">
            <div class="cart-header">
                <h2>Your Skincare Bag</h2>
            </div>

            <div id="cart-items-list" class="cart-items">
                <p>Your cart is empty.</p>
            </div>

            <hr class="divider">

            <section class="delivery-info">
                <h3>Delivery Details</h3>
                <div class="form-group">
                    <input type="text" id="cust-name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="cust-phone" placeholder="Phone Number" required>
                </div>
                <div class="form-group">
                    <textarea id="cust-address" placeholder="Complete Delivery Address (House No., Street, Brgy, City)" rows="3" required></textarea>
                </div>

                <h3>Payment Method</h3>
                <div class="form-group">
                    <select id="payment-method" required>
                        <option value="">Select Payment...</option>
                        <option value="cod">Cash on Delivery (COD)</option>
                        <option value="gcash">GCash</option>
                        <option value="card">Credit/Debit Card</option>
                    </select>
                </div>
            </section>

            <div class="cart-footer">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-total">₱0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span style="color: #2ecc71; font-weight: bold;">FREE</span>
                </div>
                <hr>
                <div class="summary-row total">
                    <strong>Total Amount</strong>
                    <strong id="final-total">₱0.00</strong>
                </div>
                
                <button class="checkout-btn" onclick="processOrder()">Place Order</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
